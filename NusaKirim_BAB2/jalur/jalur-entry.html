<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/icon.png" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link
      href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>NusaKirim Admin | Tambah Jalur</title>
  </head>
  <body>
    <div class="sidebar">
      <div class="logo-details">
        <img src="../assets/icon.png" alt="" />
        <span class="logo_name">NusaKirim</span>
      </div>
      <ul class="nav-links">
        <li>
          <a href="../admin.html">
            <i class="bx bx-grid-alt"></i>
            <span class="links_name">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="jalur.html" class="active">
            <i class="bx bx-box"></i>
            <span class="links_name">Jalur Pengiriman</span>
          </a>
        </li>
        <li>
          <a href="../pengiriman/pengiriman.html">
            <i class="bx bx-list-ul"></i>
            <span class="links_name">Pengiriman</span>
          </a>
        </li>
        <li>
          <a href="../index.html">
            <i class="bx bx-log-out"></i>
            <span class="links_name">Log out</span>
          </a>
        </li>
      </ul>
    </div>

    <section class="home-section">
      <nav>
        <div class="sidebar-button">
          <i class="bx bx-menu sidebarBtn"></i>
        </div>
        <div class="profile-details">
          <img src="../assets/avatar.png" alt="" />
          <span class="admin_name">Saverio Eudes S.</span>
        </div>
      </nav>

      <div class="home-content">
        <h1>Tambah Jalur Pengiriman</h1>
        <p class="subtitle">Isi data jalur pengiriman baru</p>

        <div class="form-entry">
          <form action="">
            <label for="nama">Nama Jalur</label>
            <input
              class="input"
              type="text"
              id="nama"
              name="nama"
              placeholder="Contoh: Darat"
            />

            <label for="tarif">Tarif (per kg)</label>
            <input
              class="input"
              type="text"
              id="tarif"
              name="tarif"
              placeholder="Contoh: Rp15.000"
            />

            <label for="deskripsi">Deskripsi</label>
            <input
              class="input"
              type="text"
              id="deskripsi"
              name="deskripsi"
              placeholder="Deskripsi singkat jalur pengiriman"
            />

            <label for="foto">Foto</label>
            <input class="input" type="file" id="foto" name="foto" />

            <button type="submit" class="btn btn-simpan">Simpan</button>
          </form>
        </div>
      </div>
    </section>

    <script>
      let sidebar = document.querySelector(".sidebar");
      let sidebarBtn = document.querySelector(".sidebarBtn");
      sidebarBtn.onclick = function () {
        sidebar.classList.toggle("active");
        if (sidebar.classList.contains("active")) {
          sidebarBtn.classList.replace("bx-menu", "bx-menu-alt-right");
        } else sidebarBtn.classList.replace("bx-menu-alt-right", "bx-menu");
      };
    </script>
  </body>
</html>
